document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script>/* WEB3D · Elevate — editable configuration.\n   Positioning, capabilities, AI instructions, sample-engine content, endpoints and CTA copy live here.\n   On-screen UI copy is edited directly in the design. */\nwindow.W3D_ELEVATE = {\n  positioning: \"Technology is everywhere. Making it work for your business is where we come in.\",\n\n  // \"mock\"   = labeled sample engine (default; nothing leaves the browser)\n  // \"server\" = deployed /api/* endpoints (OpenAI + search keys live server-side only)\n  // \"llmPreview\" = design-preview AI inside Claude Design only\n  provider: \"server\",\n\n  // Leave empty until a real, tested backend exists. Empty = demo state, never a fake success.\n  endpoints: {\n    analyze:  \"/api/analyze\",  // \"/api/analyze\"  POST {profile, challenge, context} → quick plan (stage 1)\n    company:  \"/api/company\",  // \"/api/company\"  POST {companyName, context} → {candidates:[{name,url,snippet}]}\n    research: \"/api/research\",  // \"/api/research\" POST {profile, challenge, companyUrl, quickPlan} → enriched plan + sources (stage 2)\n    lead:     \"/api/lead\"   // \"/api/lead\"     POST full lead record → 2xx only after a configured destination acknowledged it\n  },\n\n  // Feature flags\n  features: {\n    research: true,          // stage-2 company research (only runs when endpoints.company + endpoints.research are set)\n    researchUiPreview: false // DESIGN REVIEW ONLY: shows the research UI with clearly-labeled fictional data. Never enable in production.\n  },\n\n  // Real process states shown while the server works. Only shown while the step is actually running/completed.\n  steps: {\n    understand: \"Understanding your challenge\",\n    find: \"Finding your company\",\n    review: \"Reviewing public information\",\n    prepare: \"Preparing recommendations\"\n  },\n  thinkingMessages: [\n    \"Understanding your challenge…\",\n    \"Identifying possible bottlenecks…\",\n    \"Exploring practical next steps…\",\n    \"Preparing your business elevation plan…\"\n  ],\n\n  aiDisclosure: \"Your company, job title and challenge are processed by an external AI provider to create the plan. Please don't include confidential information. Audio is never stored.\",\n  researchUnavailable: \"We couldn't verify enough public information for a company-specific comparison. This initial plan is based on what you shared.\",\n\n  lead: {\n    bestTimes: [\"Morning\", \"Afternoon\", \"Anytime\", \"Email first\"],\n    consentText: \"I agree that WEB3D may use my contact details to follow up on this plan. No unrelated marketing.\",\n    privacyUrl: \"\", // approved privacy notice URL — required before the event\n    successTitle: \"You're all set.\",\n    successBody: \"We've received your plan and contact details. Someone from the WEB3D team will reach out to set up a short conversation.\"\n  },\n\n  defaultSource: \"nfc_elevate_nyc_2026\",\n\n  // Verified WEB3D capabilities (edit to match approved US messaging). Used by the AI prompt.\n  capabilities: [\n    \"Business process and workflow analysis\",\n    \"monday.com implementation and customization (where it fits)\",\n    \"Software and system integrations (CRM, ERP, marketing tools)\",\n    \"Workflow and marketing automation\",\n    \"Custom software and application development\",\n    \"Digital operations, reporting and measurement\",\n    \"Website design, development and maintenance\",\n    \"Digital marketing (SEO, paid media, social)\"\n  ],\n\n  systemPrompt: \"You are WEB3D's preliminary business solutions consultant for US business decision-makers. Lead with the business challenge, not WEB3D's service catalog. Restate the facts carefully, separate assumptions from facts, recommend 3-5 prioritized actions (each with why it matters and a first practical move), and only then suggest where approved WEB3D capabilities are potentially relevant: a one-sentence summary plus 2-3 helpAreas, each naming one approved capability, how it applies to THIS challenge, and which action step numbers it supports. Do not infer facts about the company from its name. No invented results, KPIs, ROI, deadlines or research. Do not default to website development or monday.com.\",\n\n  exampleChallenge: \"Our marketing, website and CRM data don't connect, so sales teams spend hours updating leads manually.\",\n\n  // Deterministic SAMPLE engine (provider = \"mock\"). Keyword themes → assessment content.\n  themes: [\n    {\n      id: \"data\",\n      keywords: [\"crm\", \"data\", \"connect\", \"integrat\", \"sync\", \"spreadsheet\", \"excel\", \"silo\", \"systems\", \"tools\", \"update\", \"duplicate\", \"communicate\"],\n      summary: \"information lives in several systems that don't share it, so people bridge the gaps by hand.\",\n      assumption: \"We're assuming the main loss happens at the handoff between tools. The exact point where data breaks needs validation.\",\n      opportunity: \"A more consistent flow of information between your tools could reduce repeated entry and make follow-up easier to manage.\",\n      actions: [\n        { action: \"Map one record's journey\", why: \"You can't fix a handoff you can't see.\", firstMove: \"Follow a single recent lead from first touch to closed deal and list every tool it passed through.\", owner: \"Operations lead\" },\n        { action: \"Find the most expensive gap\", why: \"Not every gap costs the same; one usually causes most of the re-work.\", firstMove: \"Ask the team where they copy, export or re-type data most often each week.\", owner: \"Sales + marketing\" },\n        { action: \"Pilot one connection\", why: \"A small, measurable fix builds confidence before a bigger integration project.\", firstMove: \"Automate the single highest-friction handoff and compare time spent before and after.\" }\n      ],\n      help: \"WEB3D could help map the workflow and, where appropriate, design and implement integrations and automation between your existing systems.\",\n      helpAreas: [\n        { area: \"Business process and workflow analysis\", how: \"Trace where each record is created, copied and checked, so the real handoff points are visible.\", steps: [1] },\n        { area: \"Software and system integrations (CRM, ERP, marketing tools)\", how: \"Connect the systems you already use so data moves once, without re-entry.\", steps: [2,3] },\n        { area: \"Workflow and marketing automation\", how: \"Automate the handoff with the most manual effort first, then measure the difference.\", steps: [3] }\n      ],\n      clarify: [\"Which systems are involved today, and who owns each?\", \"Where does the most time go: entry, checking or chasing?\"]\n    },\n    {\n      id: \"workflow\",\n      keywords: [\"manual\", \"process\", \"approval\", \"hours\", \"repetitive\", \"workflow\", \"operations\", \"paper\", \"slow\", \"bottleneck\", \"admin\"],\n      summary: \"a recurring process depends on manual steps that take time and are easy to delay.\",\n      assumption: \"We're assuming the process is fairly repeatable. If it varies a lot case by case, the approach changes.\",\n      opportunity: \"Clarifying and standardizing the process could free up time and make status easier to see.\",\n      actions: [\n        { action: \"Document the real process\", why: \"The official process and the real one often differ — workarounds hide the true cost.\", firstMove: \"Sit with one person who runs it and write down every step, including the workarounds.\", owner: \"Process owner\" },\n        { action: \"Separate judgment from mechanics\", why: \"Only mechanical steps are good automation candidates.\", firstMove: \"Mark each step as 'needs a decision' or 'purely mechanical'.\" },\n        { action: \"Automate one mechanical step\", why: \"Quick wins show value and reveal hidden dependencies.\", firstMove: \"Pick the most frequent mechanical step and automate it in the tools you already use.\" }\n      ],\n      help: \"WEB3D could help map the process and, where it fits, build workflows and automation — in monday.com or in the tools you already use.\",\n      helpAreas: [\n        { area: \"Business process and workflow analysis\", how: \"Document the steps, owners and exceptions before anything is automated.\", steps: [1] },\n        { area: \"Workflow and marketing automation\", how: \"Remove repetitive mechanical steps inside the tools your team already works in.\", steps: [3] },\n        { area: \"monday.com implementation and customization (where it fits)\", how: \"If a shared workspace is missing, set up one place to run and track the process.\", steps: [2] }\n      ],\n      clarify: [\"How often does this process run, and how many people touch it?\", \"What happens today when a step is missed?\"]\n    },\n    {\n      id: \"growth\",\n      keywords: [\"lead\", \"marketing\", \"pipeline\", \"sales\", \"conversion\", \"traffic\", \"customers\", \"acquisition\", \"campaign\", \"follow-up\", \"follow up\"],\n      summary: \"turning interest into qualified opportunities isn't as consistent as you'd like.\",\n      assumption: \"We're assuming demand exists and the gap is in capture, qualification or follow-up — not in the offer itself.\",\n      opportunity: \"A clearer path from first touch to sales conversation could make it easier to see which efforts actually create opportunities.\",\n      actions: [\n        { action: \"Define a qualified lead\", why: \"Sales and marketing can't improve a handoff they define differently.\", firstMove: \"Agree on 3–4 written criteria for a qualified lead with both teams.\", owner: \"Sales + marketing leads\" },\n        { action: \"Measure response speed by source\", why: \"Slow follow-up is a common, fixable leak.\", firstMove: \"Pull last month's leads and note how long each source waited for a first reply.\" },\n        { action: \"Fix the leakiest step first\", why: \"Adding channels to a leaky funnel multiplies the leak.\", firstMove: \"Choose the single slowest or most-dropped step and redesign just that.\" }\n      ],\n      help: \"WEB3D could help review the lead journey and, where relevant, connect marketing, website and CRM activity.\",\n      helpAreas: [\n        { area: \"Digital operations, reporting and measurement\", how: \"Make every stage of the lead journey visible, from first touch to follow-up.\", steps: [1] },\n        { area: \"Software and system integrations (CRM, ERP, marketing tools)\", how: \"Pass leads from campaigns and the website into the CRM with their context intact.\", steps: [2] },\n        { area: \"Website design, development and maintenance\", how: \"Fix the specific page or form where leads drop, if that's where the leak is.\", steps: [3] }\n      ],\n      clarify: [\"Which channels bring the leads you value most?\", \"How is follow-up assigned and tracked today?\"]\n    },\n    {\n      id: \"visibility\",\n      keywords: [\"report\", \"visibility\", \"dashboard\", \"kpi\", \"insight\", \"forecast\", \"metrics\", \"numbers\", \"decision\", \"track\"],\n      summary: \"it's hard to get a timely, trusted view of how the business is performing.\",\n      assumption: \"We're assuming the data mostly exists but is scattered or inconsistent, rather than missing entirely.\",\n      opportunity: \"A shared, reliable view of a few key measures could speed up decisions and reduce time spent assembling reports.\",\n      actions: [\n        { action: \"Agree on the weekly questions\", why: \"Dashboards fail when they answer questions nobody asked.\", firstMove: \"List the 3–5 questions leadership needs answered every week.\", owner: \"Leadership team\" },\n        { action: \"Locate each answer's data\", why: \"Knowing where data lives exposes gaps and owners.\", firstMove: \"For each question, note the system, the owner and how it's updated today.\" },\n        { action: \"Automate one view\", why: \"A small trusted view beats a large untrusted one.\", firstMove: \"Build one automated report for those questions before expanding.\" }\n      ],\n      help: \"WEB3D could help connect the underlying sources and set up reporting views in your existing platforms.\",\n      helpAreas: [\n        { area: \"Software and system integrations (CRM, ERP, marketing tools)\", how: \"Bring the sources behind each decision into one consistent dataset.\", steps: [2] },\n        { area: \"Digital operations, reporting and measurement\", how: \"Build the first automated view around the questions leadership actually asks.\", steps: [1,3] }\n      ],\n      clarify: [\"Which decisions are currently delayed by missing information?\", \"How is reporting produced today, and by whom?\"]\n    },\n    {\n      id: \"team\",\n      keywords: [\"team\", \"context\", \"project\", \"deadline\", \"alignment\", \"handoff\", \"collaborat\", \"department\", \"remote\", \"ownership\"],\n      summary: \"work between people or teams loses momentum because ownership and status aren't always clear.\",\n      assumption: \"We're assuming the issue is coordination rather than capacity. If teams are simply overloaded, priorities come first.\",\n      opportunity: \"A single, agreed way of tracking work and handoffs could reduce follow-up messages and missed deadlines.\",\n      actions: [\n        { action: \"Pick one stalling workflow\", why: \"Fixing everything at once rarely sticks.\", firstMove: \"Choose the cross-team workflow that most often needs chasing.\", owner: \"Department heads\" },\n        { action: \"Define owners and 'done'\", why: \"Unclear ownership is the most common cause of stalled handoffs.\", firstMove: \"Write down who owns each stage and what 'done' means at each handoff.\" },\n        { action: \"Run it in one shared place\", why: \"One source of truth removes status-chasing.\", firstMove: \"Track that workflow in a single shared board for a few weeks, then review.\" }\n      ],\n      help: \"WEB3D could help design the workflow and, where appropriate, implement it in a work-management platform such as monday.com.\",\n      helpAreas: [\n        { area: \"Business process and workflow analysis\", how: \"Define who owns each handoff and what 'done' means at every step.\", steps: [1] },\n        { area: \"monday.com implementation and customization (where it fits)\", how: \"Run the workflow in one shared board with clear status and ownership.\", steps: [3] },\n        { area: \"Workflow and marketing automation\", how: \"Automate reminders and status updates so nobody has to chase.\", steps: [2] }\n      ],\n      clarify: [\"Where do handoffs most often stall?\", \"Which tools do the teams use today?\"]\n    },\n    {\n      id: \"digital\",\n      keywords: [\"website\", \"site\", \"brand\", \"online\", \"ecommerce\", \"e-commerce\", \"app\", \"digital presence\", \"seo\"],\n      summary: \"your digital presence isn't fully supporting what the business needs from it.\",\n      assumption: \"We're assuming the goal is business results (leads, sales, support) rather than a visual refresh alone.\",\n      opportunity: \"Aligning your digital channels with a clear business goal could make them easier to measure and improve.\",\n      actions: [\n        { action: \"Name the one job\", why: \"A site that tries to do everything does nothing well.\", firstMove: \"Write the single most important action a visitor should take.\" },\n        { action: \"Check how well it does that job\", why: \"Decisions should start from current data, not opinions.\", firstMove: \"Review the analytics you already have for that one action.\" },\n        { action: \"Make the smallest effective change\", why: \"Targeted fixes are cheaper and faster than a rebuild.\", firstMove: \"Prioritize 2–3 changes that directly serve that job before considering a redesign.\" }\n      ],\n      help: \"WEB3D could help assess the current experience and, if it makes sense, support design, development or marketing work.\",\n      helpAreas: [\n        { area: \"Website design, development and maintenance\", how: \"Make targeted changes to the pages that serve the main visitor goal.\", steps: [3] },\n        { area: \"Digital marketing (SEO, paid media, social)\", how: \"Align traffic sources with the pages and offers that convert.\", steps: [2] },\n        { area: \"Digital operations, reporting and measurement\", how: \"Set up measurement so each change can be judged on evidence.\", steps: [1] }\n      ],\n      clarify: [\"What should a visitor do that they don't do today?\", \"How is that measured right now?\"]\n    }\n  ],\n\n  fallbackTheme: {\n    id: \"general\",\n    summary: \"your challenge touches several parts of how the business runs, and a short description isn't enough to pinpoint where it starts.\",\n    assumption: \"We haven't assumed a specific cause — that would need a short conversation.\",\n    opportunity: \"Understanding where the challenge actually starts usually reveals a smaller, more practical first move than expected.\",\n    actions: [\n      { action: \"Define 'solved'\", why: \"A clear target keeps the effort focused.\", firstMove: \"Describe the outcome you want in one measurable sentence.\" },\n      { action: \"List who and what is involved\", why: \"People, steps and tools together show where friction lives.\", firstMove: \"Write down the people, steps and tools involved today.\" },\n      { action: \"Find the first breaking point\", why: \"Fixing the earliest failure often resolves later ones.\", firstMove: \"Identify the single point where things most often slow down or break.\" }\n    ],\n    help: \"If it's relevant, WEB3D could help explore the workflow and the technology around it with you.\",\n      helpAreas: [\n        { area: \"Business process and workflow analysis\", how: \"Map the workflow end to end to find the first point where it breaks.\", steps: [1,3] },\n        { area: \"Software and system integrations (CRM, ERP, marketing tools)\", how: \"Check whether the tools involved can share data instead of relying on people.\", steps: [2] }\n      ],\n    clarify: [\"What would 'solved' look like six months from now?\", \"Who feels the impact of this most?\"]\n  }\n};\n<\u002Fscript>\n<script src=\"c0d6c71b-9e24-4b0f-8fca-9ad046915a21\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* cyrillic-ext */\n@font-face {\n  font-family: 'Nunito Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"5c826470-b760-4990-a378-affedb03bff1\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Nunito Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"4ab8f58f-690d-43c5-a4b0-6cb162c5d0ca\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Nunito Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"95c0394d-17a9-4bfd-9006-60b8032f55ba\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Nunito Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"52f4efe2-a7c2-4354-9c68-ac6f1cef1675\") format('woff2');\n  unicode-range: U+ ng:18px;border-radius:20px;border:1.5px solid {{ rs.border }};background:{{ rs.bg }};display:flex;flex-direction:column;gap:12px\">\n            <sc-if value=\"{{ rs.isConfirm }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-direction:column;gap:12px\">\n                <div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:16px;font-weight:800;color:#141414\">Is this your company?<\u002Fspan><span style=\"font-size:13px;color:#6b6b6b\">Confirm it and we'll review its public website to make the plan company-specific.<\u002Fspan><\u002Fdiv>\n                <sc-for list=\"{{ rs.candidates }}\" as=\"cd\" hint-placeholder-count=\"1\">\n                  <div style=\"display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#ffffff;border:1px solid #efe7e5\">\n                    <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:15px;font-weight:700;color:#141414\">{{ cd.name }}<\u002Fspan><span style=\"font-size:13px;color:#F0565C;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ cd.host }}<\u002Fspan><span style=\"font-size:12px;color:#6b6b6b;text-wrap:pretty\">{{ cd.snippet }}<\u002Fspan><\u002Fdiv>\n                    <button sc-camel-on-click=\"{{ cd.yes }}\" style=\"flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid #F0565C;background:#ffffff;color:#F0565C;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap\" style-hover=\"background:#fff5f4\">Yes<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <sc-if value=\"{{ rs.noCandidates }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:14px;color:#3a3a3a\">We couldn't find a clear official website for {{ companyName }}. You can add it below, or skip.<\u002Fspan><\u002Fsc-if>\n                <div style=\"display:flex;gap:8px;align-items:cent
